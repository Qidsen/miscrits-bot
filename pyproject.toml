[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miscrits-hud"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.11", "mss>=9", "opencv-python>=4.9", "numpy>=1.26", "pytesseract>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["miscrits_hud", "mbot", "mbot.brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
