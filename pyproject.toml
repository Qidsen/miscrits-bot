[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miscrits-hud"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["miscrits_hud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
